<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteamPulse</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --line:#2a333d; --text:#e6edf3; --muted:#8b98a5; --accent:#66c0f4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:32px 16px 0; min-height:100vh; display:flex; flex-direction:column; }
  #chat { flex:1; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:6px 12px; font-size:14px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  form { display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:16px 0; margin-top:16px; border-top:1px solid var(--line); }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; }
  button.go { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#0f1419; font-weight:600; font-size:16px; cursor:pointer; }
  button.go:disabled { opacity:.6; cursor:wait; }
  #chat { margin-top:8px; display:flex; flex-direction:column; gap:16px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; white-space:pre-wrap; line-height:1.5; }
  .q { border-color:var(--accent); align-self:flex-end; max-width:85%; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; }
  .err { border-color:#e5534b; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-top:12px; white-space:normal; }
  .imgs.una { grid-template-columns:1fr; max-width:460px; }
  .imgs a { display:block; color:var(--muted); font-size:12px; line-height:1.3; text-decoration:none; }
  .imgs a:hover span { color:var(--accent); }
  .imgs img { width:100%; aspect-ratio:460/215; object-fit:cover; border-radius:8px; display:block; background:var(--line); }
  .imgs span { display:block; margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>🎮 SteamPulse</h1>
  <p class="sub">Pregúntale lo que quieras sobre Steam: ofertas, tendencias, noticias o compara juegos.</p>

  <div class="chips">
    <button class="chip">¿Qué ofertas buenas hay?</button>
    <button class="chip">¿Qué juegos están de moda?</button>
    <button class="chip">Compara Palworld contra Elden Ring</button>
    <button class="chip">¿Qué actualizaciones tuvo Counter-Strike 2?</button>
  </div>

  <div id="chat"></div>

  <form id="f">
    <input id="q" placeholder="Escribe tu pregunta..." autocomplete="off" maxlength="500">
    <button class="go" id="b" type="submit">Preguntar</button>
  </form>
</main>
<script>
  const f = document.getElementById("f");
  const q = document.getElementById("q");
  const b = document.getElementById("b");
  const chat = document.getElementById("chat");
  let contexto = null;  // pregunta anterior, para preguntas de seguimiento

  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + (cls || "");
    d.textContent = text;
    chat.appendChild(d);
    d.scrollIntoView({ behavior: "smooth", block: "end" });
    return d;
  }

  // Imágenes de Steam: portada del juego o la imagen de cada noticia
  function imagenesDe(d) {
    if (!d || typeof d !== "object") return [];
    if (Array.isArray(d.noticias)) {
      return d.noticias.filter(n => n.imagen).map(n => ({ src: n.imagen, link: n.url, titulo: n.titulo }));
    }
    if (d.juego1 || d.juego2) {
      return [d.juego1, d.juego2].filter(j => j && j.imagen).map(j => ({ src: j.imagen, link: j.url, titulo: j.nombre }));
    }
    if (d.imagen && d.nombre) return [{ src: d.imagen, link: d.url, titulo: null }];
    return [];
  }

  function ponerImagenes(contenedor, datos) {
    const imagenes = imagenesDe(datos);
    if (!imagenes.length) return;
    const g = document.createElement("div");
    g.className = "imgs" + (imagenes.length === 1 ? " una" : "");
    imagenes.forEach(i => {
      const a = document.createElement("a");
      a.href = i.link || i.src;
      a.target = "_blank";
      a.rel = "noopener";
      const img = document.createElement("img");
      img.src = i.src;
      img.alt = i.titulo || "";
      img.loading = "lazy";
      img.onerror = () => a.remove();   // si la imagen no carga, no se muestra nada roto
      a.appendChild(img);
      if (i.titulo) {
        const t = document.createElement("span");
        t.textContent = i.titulo;
        a.appendChild(t);
      }
      g.appendChild(a);
    });
    contenedor.appendChild(g);
  }

  async function ask(pregunta) {
    if (!pregunta.trim()) return;
    b.disabled = true;
    add(pregunta, "q");
    const wait = add("Pensando… (la primera vez puede tardar hasta 1 minuto)");
    try {
      const r = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pregunta, contexto })
      });
      const data = await r.json();
      if (data.tool && data.tool !== "none") {
        contexto = { pregunta, tool: data.tool, params: data.params || {} };
      }
      wait.textContent = data.respuesta || data.detail || "Sin respuesta";
      ponerImagenes(wait, data.datos);
      const meta = document.createElement("div");
      meta.className = "meta";
      const total = (data.trace || []).reduce((s, t) => s + t.ms, 0);
      const llm = data.limites ? ` · LLM: ${data.limites.llamadas_llm} llamada(s)` : "";
      meta.textContent = data.tool ? `Herramienta: ${data.tool} · ${(total / 1000).toFixed(1)} s${llm}` : "";
      wait.appendChild(meta);
      wait.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      wait.textContent = "No pude conectar con SteamPulse. Intenta de nuevo.";
      wait.classList.add("err");
    } finally {
      b.disabled = false;
      q.value = "";
      q.focus();
    }
  }

  // Al abrir la página se "despierta" el servidor (Render duerme el plan gratis)
  const aviso = add("Conectando con SteamPulse… (si estaba dormido puede tardar hasta un minuto)");
  fetch("/health")
    .then(() => { aviso.textContent = "¡Listo! Pregúntame sobre ofertas, géneros, un juego en específico o compara dos juegos."; })
    .catch(() => { aviso.textContent = "No pude conectar todavía. Intenta preguntar en unos segundos."; });

  f.addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => ask(c.textContent)));
</script>
</body>
</html>
